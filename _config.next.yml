# NexT Theme Configuration
# Docs: https://theme-next.js.org/

# Scheme
scheme: Gemini

# Dark Mode
darkmode: true

# Site Info
favicon:
  small: /images/favicon-16x16.png
  medium: /images/favicon-32x32.png

# Menu
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  categories: /categories/ || fa fa-th
  tags: /tags/ || fa fa-tags

# Social Links
social:
  GitHub: https://github.com/jpf-hash || fab fa-github
social_icons:
  enable: true
  icons_only: false
  transition: false

# Avatar
avatar:
  url: /images/avatar.gif
  rounded: true
  rotated: true

# Code Blocks
codeblock:
  highlight_theme: default
  copy_button:
    enable: true
    style: macside

# Sidebar
sidebar:
  position: left
  width: 320
  padding: 18
  offset: 12
  b2t: true
  scrollpercent: true

# Back to Top
back2top:
  enable: true
  sidebar: true
  scrollpercent: true

# Reading Progress
reading_progress:
  enable: true
  position: top
  color: "#37c6c0"
  height: 3px

# Font
font:
  enable: true
  host: https://fonts.googleapis.com
  global:
    external: true
    family: ""
    size:
  title:
    external: true
    family: ""
    size:
  headings:
    external: true
    family: ""
    size:
  posts:
    external: true
    family: ""
    size:
  codes:
    external: true
    family: ""
    size:

# SEO
seo: true
index_with_subtitle: true

# Local Search
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1
  unescape: false
  preload: false

# Tags
tagcloud:
  min: 12
  max: 30
  amount: 200
  orderby: name
  order: 1

# Related Posts
related_posts:
  enable: true
  icon: fa fa-signs-post

# Post Meta
post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

# Footer
footer:
  since: 2020
  icon:
    name: fa fa-heart
    animated: true
    color: "#ff6d6d"
  powered:
    enable: true
    version: true
  copyright:
    enable: true
    since: 2020
  custom_text:

# Miscellaneous
mobile_layout_economy: true
android_chrome_color: "#1976d2"
custom_logo: false
highlight_theme: normal
