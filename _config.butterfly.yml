# Butterfly Theme Configuration
# Docs: https://butterfly.js.org/

# Navigation
nav:
  logo:
  display_title: true
  fixed: false

# Meta
meta:
  theme_color: false

# Social Links
social:
  fab fa-github: https://github.com/jpf-hash || Github

# Avatar
avatar:
  img: /img/avatar.png
  effect: false

# Article Meta
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    date_type: both
    date_format: relative
    categories: true
    tags: true
    label: true

# Page Template
index_layout: 2

# Social Sharing
share:
  enable: true
  type: sharejs

# Comments
comments:
  enable: false

# Search
search:
  enable: true
  path: search.xml
  field: post
  content: true
  format: hexo

# Code Blocks
highlight_theme: mac
highlight_copy: true
highlight_lang: true
highlight_height_limit: 300

# Table of Contents
toc:
  enable: true
  number: true
  style_simple: false

# Sidebars
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 学习记录与技术分享
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/jpf-hash
  card_announcement:
    enable: true
    content: 欢迎来到我的博客！这里记录了我的学习笔记和技术分享。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    limit: 8
    sort_order:
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# Footer
footer:
  owner:
    enable: true
    since: 2020
  custom_text:
  copyright: true
  runtime:
    enable: true
    launch_time: 01/01/2020 00:00:00
    work_img: /img/running.svg
    work_description: 正在奋力加载中……
    downtime_img: /img/running.svg
    downtime_description: 很抱歉，网站暂时无法访问！
  busuanzi:
    enable: true
    total_visitors: true
    total_visitors_icon: fa fa-user
    total_views: true
    total_views_icon: fa fa-eye
    post_views: true
    post_views_icon: fa fa-eye

# Right Menu
rightside:
  enable: true
  hide: false
  show:
    - readmode
    - darkmode
    - hideAside
    - fullscreen
    - share

# Dark Mode
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# Read Mode
readmode:
  enable: true

# Anchor
anchor:
  auto_update: false
  click:
    scroll_decode: true

# Tag Plugins
tag_plugins:
  notice:
    enable: true
    style: simple
    global: false
    font:
    border:
